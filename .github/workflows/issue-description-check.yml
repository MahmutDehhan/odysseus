name: ci / issue description check

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  # contents:read is required by the actions/checkout below. Without it this job
  # only works because this repository is PUBLIC -- checkout silently falls back to
  # an unauthenticated clone. The moment odysseus goes private, GITHUB_TOKEN has no
  # contents scope and checkout fails with "Repository not found" (GitHub answers an
  # unauthorised private clone with not-found, not forbidden), which reads like a
  # missing repo rather than a permissions bug.
  #
  # That exact shape cost m1d0-control-plane three weeks of container CVE scanning.
  contents: read
  issues: write

jobs:
  check:
    name: Check issue description
    runs-on: ubuntu-latest
    # Skip bots (Dependabot, release-drafter, etc.)
    if: ${{ github.event.issue.user.type != 'Bot' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: return require('./.github/scripts/check-issue-description.js')({github, context, core})
